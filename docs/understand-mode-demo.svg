<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="understand-mode demo: Claude answers four requests in four formats: text, a box diagram, an HTML explorer and an explainer video">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
    .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .acc { fill: #7ee787; } .ora { fill: #d97757; } .blu { fill: #79c0ff; }
    .t15 { font-size: 15px; } .t13 { font-size: 13px; } .t12 { font-size: 12px; } .t16 { font-size: 16px; }

    .sc, .type, .badge, .o1, .o2, .o3, .o4, .play, .hl {
      animation-duration: 20s; animation-iteration-count: infinite;
      animation-fill-mode: both; animation-timing-function: linear;
    }
    .sc { animation-name: sc; opacity: 0; }
    .hl { animation-name: sc; opacity: 0; }
    .type { animation-name: type; }
    .badge { animation-name: badge; }
    .o1 { animation-name: o1; } .o2 { animation-name: o2; } .o3 { animation-name: o3; } .o4 { animation-name: o4; }
    .play { animation-name: play; transform-box: fill-box; transform-origin: left center; }
    .d2 { animation-delay: 5s; } .d3 { animation-delay: 10s; } .d4 { animation-delay: 15s; }

    @keyframes sc    { 0% { opacity: 0 } 1.5% { opacity: 1 } 23.5% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes type  { 0% { transform: translateX(0) } 7%, 100% { transform: translateX(640px) } }
    @keyframes badge { 0%, 8% { opacity: 0 } 9.5%, 100% { opacity: 1 } }
    @keyframes o1 { 0%, 10% { opacity: 0; transform: translateY(6px) } 12%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes o2 { 0%, 11.5% { opacity: 0; transform: translateY(6px) } 13.5%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes o3 { 0%, 13% { opacity: 0; transform: translateY(6px) } 15%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes o4 { 0%, 14.5% { opacity: 0; transform: translateY(6px) } 16.5%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes play  { 0%, 12% { transform: scaleX(0) } 23.5%, 100% { transform: scaleX(1) } }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="860" height="500" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="860" height="40" rx="14" fill="#161b22"/>
  <rect x="0" y="26" width="860" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" class="dim t13">claude · understand-mode</text>
  <rect x="690" y="9" width="152" height="22" rx="11" fill="none" stroke="#7ee787" stroke-opacity="0.5"/>
  <text x="766" y="25" text-anchor="middle" class="acc t12">/understand auto</text>

  <!-- format strip -->
  <line x1="40" y1="452" x2="820" y2="452" stroke="#21262d"/>
  <g class="t13">
    <rect class="hl"    x="40"  y="463" width="180" height="26" rx="6" fill="#7ee787" fill-opacity="0.15"/>
    <rect class="hl d2" x="240" y="463" width="180" height="26" rx="6" fill="#7ee787" fill-opacity="0.15"/>
    <rect class="hl d3" x="440" y="463" width="180" height="26" rx="6" fill="#7ee787" fill-opacity="0.15"/>
    <rect class="hl d4" x="640" y="463" width="180" height="26" rx="6" fill="#7ee787" fill-opacity="0.15"/>
    <text x="130" y="481" text-anchor="middle" class="dim">1 · text (STE)</text>
    <text x="330" y="481" text-anchor="middle" class="dim">2 · diagram</text>
    <text x="530" y="481" text-anchor="middle" class="dim">3 · html page</text>
    <text x="730" y="481" text-anchor="middle" class="dim">4 · video</text>
  </g>

  <!-- scene 1: text -->
  <g class="sc">
    <text x="40" y="84" class="t16"><tspan class="ora">❯ </tspan><tspan class="fg">what changed in the auth service?</tspan></text>
    <rect class="type" x="64" y="64" width="660" height="28" fill="#0d1117"/>
    <g class="badge"><rect x="40" y="106" width="150" height="26" rx="6" fill="none" stroke="#7ee787"/><text x="115" y="124" text-anchor="middle" class="acc t13">Format: text</text></g>
    <text x="40" y="180" class="fg t15 o1">The login timeout is fixed. Tokens now refresh 60s before expiry.</text>
    <text x="40" y="216" class="fg t15 o2"><tspan class="dim">1.</tspan> Add a refresh check in session.ts:42.</text>
    <text x="40" y="244" class="fg t15 o2"><tspan class="dim">2.</tspan> Add 3 tests. All 41 tests pass.</text>
    <text x="40" y="290" class="t15 o3"><tspan class="acc">Check next:</tspan><tspan class="fg"> the retry limit. It is now 3.</tspan></text>
    <text x="40" y="350" class="dim t13 o4">One idea per sentence · active voice · one name per thing · numbers, not adjectives</text>
  </g>

  <!-- scene 2: diagram -->
  <g class="sc d2">
    <text x="40" y="84" class="t16"><tspan class="ora">❯ </tspan><tspan class="fg">how do the services talk to each other?</tspan></text>
    <rect class="type d2" x="64" y="64" width="660" height="28" fill="#0d1117"/>
    <g class="badge d2"><rect x="40" y="106" width="230" height="26" rx="6" fill="none" stroke="#7ee787"/><text x="155" y="124" text-anchor="middle" class="acc t13">Format: diagram + text</text></g>
    <g class="o1 d2">
      <g fill="none" stroke="#79c0ff" stroke-width="1.5">
        <rect x="60"  y="156" width="90"  height="38"/>
        <rect x="210" y="156" width="90"  height="38"/>
        <rect x="360" y="156" width="90"  height="38"/>
        <rect x="200" y="236" width="110" height="38"/>
        <rect x="370" y="236" width="110" height="38"/>
        <path d="M150 175 H202 M300 175 H352 M255 194 V228 M310 255 H362"/>
      </g>
      <g fill="#79c0ff">
        <path d="M210 175 l-9 -5 v10 z"/><path d="M360 175 l-9 -5 v10 z"/>
        <path d="M255 236 l-5 -9 h10 z"/><path d="M370 255 l-9 -5 v10 z"/>
      </g>
      <g class="blu t16" text-anchor="middle">
        <text x="105" y="181">web</text><text x="255" y="181">api</text><text x="405" y="181">db</text>
        <text x="255" y="261">queue</text><text x="425" y="261">worker</text>
      </g>
    </g>
    <text x="40" y="350" class="fg t15 o3 d2">The api writes jobs to the queue. The worker reads them.</text>
    <text x="40" y="390" class="dim t13 o4 d2">Box-drawing text in the terminal · Mermaid/SVG only inside HTML pages</text>
  </g>

  <!-- scene 3: html page -->
  <g class="sc d3">
    <text x="40" y="84" class="t16"><tspan class="ora">❯ </tspan><tspan class="fg">compare the 40 benchmark runs</tspan></text>
    <rect class="type d3" x="64" y="64" width="660" height="28" fill="#0d1117"/>
    <g class="badge d3"><rect x="40" y="106" width="200" height="26" rx="6" fill="none" stroke="#7ee787"/><text x="140" y="124" text-anchor="middle" class="acc t13">Format: html + text</text></g>
    <g class="o1 d3">
      <rect x="40" y="148" width="560" height="232" rx="8" fill="#f6f8fa"/>
      <rect x="40" y="148" width="560" height="30" rx="8" fill="#d0d7de"/><rect x="40" y="168" width="560" height="10" fill="#d0d7de"/>
      <rect x="70" y="155" width="380" height="16" rx="8" fill="#ffffff"/>
      <text x="82" y="167" font-size="11" fill="#57606a">file:///tmp/bench-explorer.html</text>
      <g font-size="11">
        <rect x="60" y="190" width="70" height="20" rx="10" fill="#0969da"/><text x="95" y="204" text-anchor="middle" fill="#fff">all runs</text>
        <rect x="138" y="190" width="90" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="183" y="204" text-anchor="middle" fill="#24292f">regressions</text>
        <rect x="236" y="190" width="50" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="261" y="204" text-anchor="middle" fill="#24292f">gpu</text>
      </g>
      <line x1="60" y1="360" x2="580" y2="360" stroke="#d0d7de"/>
      <g fill="#8c959f">
        <rect x="70"  y="300" width="26" height="60"/><rect x="104" y="290" width="26" height="70"/><rect x="138" y="305" width="26" height="55"/>
        <rect x="172" y="280" width="26" height="80"/><rect x="206" y="296" width="26" height="64"/><rect x="240" y="286" width="26" height="74"/>
        <rect x="308" y="300" width="26" height="60"/><rect x="342" y="292" width="26" height="68"/><rect x="376" y="310" width="26" height="50"/>
        <rect x="410" y="288" width="26" height="72"/><rect x="444" y="298" width="26" height="62"/><rect x="512" y="294" width="26" height="66"/>
      </g>
      <rect x="274" y="222" width="26" height="138" fill="#1a7f37"/>
      <rect x="478" y="250" width="26" height="110" fill="#cf222e"/>
      <text x="287" y="376" text-anchor="middle" font-size="10" fill="#1a7f37">#17</text>
      <text x="491" y="376" text-anchor="middle" font-size="10" fill="#cf222e">#31</text>
    </g>
    <g class="t13">
      <text x="624" y="176" class="dim o2 d3">TAKEAWAY</text>
      <text x="624" y="204" class="fg o2 d3">Run 17 is 2.3x</text>
      <text x="624" y="222" class="fg o2 d3">faster.</text>
      <text x="624" y="254" class="fg o3 d3">3 runs regress.</text>
      <text x="624" y="272" class="fg o3 d3">Worst: run 31.</text>
      <text x="624" y="304" class="acc o4 d3">Check next:</text>
      <text x="624" y="322" class="fg o4 d3">run 31 config.</text>
    </g>
    <text x="40" y="414" class="dim t13 o4 d3">One self-contained file · no build step · explore instead of scrolling</text>
  </g>

  <!-- scene 4: video -->
  <g class="sc d4">
    <text x="40" y="84" class="t16"><tspan class="ora">❯ </tspan><tspan class="fg">how does gradient descent find the minimum?</tspan></text>
    <rect class="type d4" x="64" y="64" width="660" height="28" fill="#0d1117"/>
    <g class="badge d4"><rect x="40" y="106" width="250" height="26" rx="6" fill="none" stroke="#7ee787"/><text x="165" y="124" text-anchor="middle" class="acc t13">Format: video (Manim style)</text></g>
    <g class="o1 d4">
      <rect x="40" y="148" width="560" height="270" rx="8" fill="#000"/>
      <line x1="90" y1="360" x2="560" y2="360" stroke="#555"/>
      <line x1="90" y1="170" x2="90" y2="360" stroke="#555"/>
      <path id="bowl" d="M 120 180 Q 320 520 520 180" fill="none" stroke="#58c4dd" stroke-width="3"/>
      <circle r="8" fill="#fc6255">
        <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8;0.96;1" keyPoints="0.06;0.06;0.5;0.5">
          <mpath href="#bowl"/>
        </animateMotion>
      </circle>
      <text x="320" y="384" text-anchor="middle" font-size="13" fill="#ffffff">step against the slope, smaller as it flattens</text>
      <rect x="60" y="398" width="520" height="4" rx="2" fill="#333"/>
      <rect class="play d4" x="60" y="398" width="520" height="4" rx="2" fill="#fc6255"/>
    </g>
    <g class="t13">
      <text x="624" y="176" class="dim o2 d4">WHY VIDEO</text>
      <text x="624" y="204" class="fg o2 d4">The idea moves</text>
      <text x="624" y="222" class="fg o2 d4">over time.</text>
      <text x="624" y="254" class="fg o3 d4">Only when asked</text>
      <text x="624" y="272" class="fg o3 d4">or high value.</text>
      <text x="624" y="304" class="acc o4 d4">Fallback:</text>
      <text x="624" y="322" class="fg o4 d4">diagram or html.</text>
    </g>
  </g>
</svg>
